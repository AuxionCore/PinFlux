<div class="bookmark-item pf-bookmark-item">
  <span class="pf-bookmark-icon" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
    </svg>
  </span>

  <div class="pf-bookmark-content">
    <a
      href="#{{sectionId}}"
      class="bookmark-link pf-bookmark-link"
      data-bookmark-link
      data-section-id="{{sectionId}}"
      title="{{displayName}}"
    >
      {{displayName}}
    </a>

    <!-- שדה עריכה inline (מוסתר בהתחלה) -->
    <div class="bookmark-edit-container hidden pf-bookmark-edit" data-edit-container>
      <div class="pf-bookmark-edit-row">
        <input
          type="text"
          data-edit-input
          maxlength="100"
          value="{{displayName}}"
        />
        <button
          type="button"
          data-save-edit
          data-section-id="{{sectionId}}"
          aria-label="Save bookmark name"
          title="Save"
          class="pf-bookmark-action-btn pf-save"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 12 2 2 4-4" />
          </svg>
        </button>
        <button
          type="button"
          data-cancel-edit
          aria-label="Cancel edit"
          title="Cancel"
          class="pf-bookmark-action-btn"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 6-12 12" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="bookmark-actions pf-bookmark-actions" data-actions-container>
    <button
      type="button"
      data-edit-bookmark
      data-section-id="{{sectionId}}"
      aria-label="Rename bookmark"
      title="Rename bookmark"
      class="pf-bookmark-action-btn"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
      </svg>
    </button>
    <button
      type="button"
      data-remove-bookmark
      data-section-id="{{sectionId}}"
      aria-label="Remove bookmark"
      title="Remove bookmark"
      class="pf-bookmark-action-btn pf-danger"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
        <line x1="15" x2="9" y1="10" y2="10" />
      </svg>
    </button>
  </div>
</div>
