<div
  id="bookmark-name-popup"
  class="hidden pf-overlay"
>
  <div class="pf-dialog animate-fade-in">
    <h3 class="pf-dialog-title">
      Name this bookmark
    </h3>
    <input
      type="text"
      id="bookmark-name-input"
      placeholder="Enter bookmark name (optional)"
      class="pf-input"
      maxlength="100"
    />
    <div class="pf-dialog-actions">
      <button
        type="button"
        id="bookmark-name-cancel"
        class="pf-btn"
      >
        Cancel
      </button>
      <button
        type="button"
        id="bookmark-name-save"
        class="pf-btn pf-btn-primary"
      >
        Save Bookmark
      </button>
    </div>
  </div>
</div>

<style>
@keyframes fade-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.animate-fade-in {
  animation: fade-in 0.2s ease-out;
}
</style>
