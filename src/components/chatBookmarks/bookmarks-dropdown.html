<div
  id="bookmarks-dropdown"
  class="hidden pf-dropdown"
  style="position: fixed; z-index: 9999;"
>
  <style>
    .pf-dropdown {
      --pf-bg: #ffffff;
      --pf-surface: #f9f9f9;
      --pf-surface-hover: #ececec;
      --pf-border: #e3e3e3;
      --pf-text: #0d0d0d;
      --pf-text-secondary: #6e6e6e;
      --pf-accent: #0d0d0d;
      --pf-accent-soft: #ececec;
      --pf-ring: rgba(0, 0, 0, 0.12);
    }
    html.dark .pf-dropdown {
      --pf-bg: #212121;
      --pf-surface: #2f2f2f;
      --pf-surface-hover: #3a3a3a;
      --pf-border: #4d4d4d;
      --pf-text: #ececec;
      --pf-text-secondary: #b4b4b4;
      --pf-accent: #ffffff;
      --pf-accent-soft: #3a3a3a;
      --pf-ring: rgba(255, 255, 255, 0.15);
    }

    .pf-dropdown {
      width: 24rem;
      max-width: calc(100vw - 2rem);
      overflow: hidden;
      background: var(--pf-bg);
      color: var(--pf-text);
      border: 1px solid var(--pf-border);
      border-radius: 16px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.28), 0 4px 16px rgba(0, 0, 0, 0.12);
      font-family: inherit;
      text-align: initial;
    }
    .pf-dropdown,
    .pf-dropdown * {
      box-sizing: border-box;
    }

    .pf-dropdown-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--pf-border);
      background: linear-gradient(180deg, var(--pf-surface), transparent);
    }
    .pf-dropdown-header h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--pf-text);
    }
    .pf-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      color: var(--pf-accent);
      background: var(--pf-accent-soft);
      flex-shrink: 0;
    }
    .pf-title-icon svg {
      width: 14px;
      height: 14px;
    }

    .pf-search {
      position: relative;
      margin-top: 12px;
    }
    .pf-search input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 36px;
      font-size: 13px;
      color: var(--pf-text);
      background: var(--pf-bg);
      border: 1px solid var(--pf-border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pf-search input::placeholder {
      color: var(--pf-text-secondary);
    }
    .pf-search input:focus {
      border-color: var(--pf-accent);
      box-shadow: 0 0 0 3px var(--pf-ring);
    }
    .pf-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--pf-text-secondary);
      pointer-events: none;
    }

    .pf-dropdown-scroll {
      max-height: 24rem;
      overflow-y: auto;
      padding: 8px;
    }

    .pf-empty {
      padding: 36px 20px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: var(--pf-text-secondary);
    }
    .pf-empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      border-radius: 12px;
      color: var(--pf-text-secondary);
      background: var(--pf-surface);
    }
    .pf-empty-icon svg {
      width: 20px;
      height: 20px;
    }

    .pf-bookmark-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      margin-bottom: 6px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--pf-surface);
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .pf-bookmark-item:last-child {
      margin-bottom: 0;
    }
    .pf-bookmark-item:hover {
      background: var(--pf-surface-hover);
      border-color: var(--pf-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .pf-bookmark-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin-top: 1px;
      border-radius: 8px;
      color: var(--pf-accent);
      background: var(--pf-accent-soft);
    }
    .pf-bookmark-icon svg {
      width: 15px;
      height: 15px;
    }

    .pf-bookmark-content {
      flex: 1;
      min-width: 0;
    }
    .pf-bookmark-link {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
      color: var(--pf-text);
      text-decoration: none;
      transition: color 0.12s ease;
    }
    .pf-bookmark-link:hover {
      text-decoration: underline;
    }

    .pf-bookmark-edit-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pf-bookmark-edit-row input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 10px;
      font-size: 13px;
      color: var(--pf-text);
      background: var(--pf-bg);
      border: 1px solid var(--pf-border);
      border-radius: 8px;
      outline: none;
    }
    .pf-bookmark-edit-row input:focus {
      border-color: var(--pf-accent);
      box-shadow: 0 0 0 3px var(--pf-ring);
    }

    .pf-bookmark-actions {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .pf-bookmark-item:hover .pf-bookmark-actions,
    .pf-bookmark-item:focus-within .pf-bookmark-actions {
      opacity: 1;
    }
    .pf-bookmark-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--pf-text-secondary);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .pf-bookmark-action-btn:hover {
      background: var(--pf-surface-hover);
      color: var(--pf-text);
    }
    .pf-bookmark-action-btn svg {
      width: 15px;
      height: 15px;
    }
  </style>

  <div class="pf-dropdown-header">
    <h3>
      <span class="pf-title-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
        </svg>
      </span>
      Bookmarks in this conversation
    </h3>
    <!-- שדה חיפוש (מוסתר בהתחלה) -->
    <div id="bookmark-search-container" class="hidden">
      <div class="pf-search">
        <input
          type="text"
          id="bookmark-search-input"
          placeholder="Search bookmarks..."
        />
        <svg
          class="pf-search-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
        </svg>
      </div>
    </div>
  </div>

  <div class="pf-dropdown-scroll">
    <div id="bookmarks-list" class="pf-bookmarks-list">
      <!-- הסימניות יוכנסו כאן דינמית -->
    </div>
    <div id="no-bookmarks" class="hidden pf-empty">
      <div class="pf-empty-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" />
        </svg>
      </div>
      No bookmarks yet. Click the bookmark icon next to any section to save it.
    </div>
    <div id="no-search-results" class="hidden pf-empty">
      <div class="pf-empty-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
        </svg>
      </div>
      No bookmarks found matching your search.
    </div>
  </div>
</div>
